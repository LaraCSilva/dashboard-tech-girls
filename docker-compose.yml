version: '3.8'

services:
  backend:
    build: .
    container_name: tech-girls-backend
    ports:
      - "5000:5000"
    volumes:
      - ./backend:/app/backend
    environment:
      - FLASK_APP=app.py
      - FLASK_ENV=development

  frontend:
    image: node:18-alpine
    container_name: tech-girls-frontend
    working_dir: /app
    volumes:
      - ./src:/app
      - ./package.json:/app/package.json
    ports:
      - "5173:5173"
    command: sh -c "npm install && npm run dev"
    depends_on:
      - backend